# Monthly dependency updates, grouped to keep pull requests few. CI runs every
# check on each one; merge only when it's green. For faster security fixes, turn
# on Dependabot security updates in Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # Packages that must move together arrive in one pull request.
      framework-majors:
        patterns: [next, eslint-config-next, react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major]
    ignore:
      # These move with Next.js and its ESLint config, not on their own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
