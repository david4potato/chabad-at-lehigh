# Monthly dependency updates, grouped to keep pull requests few. CI runs every
# check on each one; merge only when it's green. For faster security fixes, turn
# on Dependabot security updates in Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions (a new Next.js, React, ESLint...) are upgraded on purpose in their own pull request.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # One pull request for all action updates; separate ones conflict in ci.yml.
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
